<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier 0 — Closed Shadow DOM</title>
</head>
<body>
  <main>
    <h1>Closed shadow root</h1>
    <p>This paragraph is in the light DOM. The card has its own styles.</p>
    <shadow-card></shadow-card>
    <button type="button">Light DOM action</button>
  </main>
  <script>
    customElements.define('shadow-card', class extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({mode:'closed'});
        root.innerHTML = `
          <style>
            :host { display: block; margin: 1rem 0; }
            section { padding: 12px; background: #eef; color: #223; font: 14px/1.4 sans-serif; }
            h2 { font-size: 18px; }
            button { padding: 6px 12px; font: inherit; color: inherit; }
          </style>
          <section aria-label="Shadow card">
            <h2>Inside the shadow root</h2>
            <p>Check whether adaptations reach this text and button.</p>
            <button type="button">Shadow action</button>
          </section>`;
      }
    });
  </script>
</body>
</html>
