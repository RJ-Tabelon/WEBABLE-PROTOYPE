<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quillon Vesperine workspace private</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #333;
      }
      .shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        height: 100vh;
      }
      nav.rail {
        background: #f4f4f2;
        padding: 12px;
        overflow: auto;
      }
      nav.rail a {
        display: block;
        padding: 4px 8px;
        font-size: 12px;
        color: #333;
      }
      .work {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
      }
      .toolbar {
        display: flex;
        gap: 4px;
        padding: 8px;
        border-bottom: 1px solid #ddd;
      }
      .toolbar button {
        width: 22px;
        height: 22px;
        padding: 0;
        font-size: 11px;
      }
      .pane {
        overflow: auto;
        padding: 16px;
      }
      table[role='grid'] {
        border-collapse: collapse;
        width: 100%;
      }
      table[role='grid'] td,
      table[role='grid'] th {
        border: 1px solid #ddd;
        padding: 2px 6px;
        font-size: 12px;
        text-align: left;
      }
      .editor {
        border: 1px solid #bbb;
        min-height: 120px;
        padding: 8px;
        margin-top: 16px;
        font-size: 13px;
      }
      .status {
        font-size: 11px;
        color: #888;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="rail" aria-label="Workspace">
        <a href="/inbox">Inbox</a><a href="/projects">Projects</a
        ><a href="/reports">Reports</a> <a href="/settings">Settings</a
        ><a href="/help">Help</a>
      </nav>
      <div class="work">
        <div class="toolbar" role="toolbar" aria-label="Formatting">
          <button type="button" aria-label="Bold">B</button>
          <button type="button" aria-label="Italic">I</button>
          <button type="button" aria-label="Underline">U</button>
          <button type="button" aria-label="Link">K</button>
        </div>
        <div class="pane">
          <table role="grid" aria-label="Tasks">
            <thead>
              <tr>
                <th>Task</th>
                <th>Owner</th>
                <th>Due</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Quillon review</td>
                <td>Vesperine</td>
                <td>Mon</td>
              </tr>
              <tr>
                <td>Budget draft</td>
                <td>Team</td>
                <td>Tue</td>
              </tr>
              <tr>
                <td>Launch notes</td>
                <td>Team</td>
                <td>Wed</td>
              </tr>
              <tr>
                <td>Retro</td>
                <td>Team</td>
                <td>Fri</td>
              </tr>
            </tbody>
          </table>
          <div
            class="editor"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            aria-label="Notes"
          >
            Private notes about Quillon Vesperine and order 48151623.
          </div>
          <p class="status">Saved a moment ago</p>
        </div>
      </div>
    </div>
  </body>
</html>
