<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Single page app</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      header {
        padding: 12px 24px;
        border-bottom: 1px solid #ddd;
      }
      header a {
        font-size: 13px;
        margin-right: 12px;
      }
      main {
        padding: 24px;
        max-width: 900px;
      }
      main p {
        font-size: 12px;
        line-height: 16px;
        color: #555;
      }
      .feed-item {
        border-bottom: 1px solid #eee;
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="App">
        <a href="/engine/spa.html" data-route="home">Home</a>
        <a href="/engine/spa.html?view=list" data-route="list">List</a>
      </nav>
    </header>
    <main id="app">
      <h1>Home</h1>
      <p>
        Initial small text rendered by the app shell. It is long enough to count
        as running text here.
      </p>
      <p>
        Another initial paragraph so the main content has substance before
        anything loads later on.
      </p>
      <div id="feed"></div>
      <button type="button" id="more">Load more</button>
    </main>
    <script>
      const feed = document.getElementById('feed');
      document.getElementById('more').addEventListener('click', () => {
        setTimeout(() => {
          for (let i = 0; i < 3; i++) {
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML =
              '<p class="late">Late item ' +
              i +
              ' with small text that arrived after the first paint.</p>';
            feed.append(item);
          }
        }, 50);
      });
      document.querySelectorAll('[data-route]').forEach((a) =>
        a.addEventListener('click', (e) => {
          e.preventDefault();
          history.pushState({}, '', a.getAttribute('href'));
          const app = document.getElementById('app');
          app.innerHTML =
            '<h1>' +
            a.textContent +
            '</h1><p>New route content in small type, replacing the old view entirely.</p>';
        }),
      );
    </script>
  </body>
</html>
