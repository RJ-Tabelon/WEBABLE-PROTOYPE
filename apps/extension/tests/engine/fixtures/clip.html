<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clipping trap</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, sans-serif;
      }
      .cards {
        display: flex;
        gap: 16px;
      }
      /* Fixed-height boxes that clip: any larger text or looser lines get cut off. */
      .card {
        width: 240px;
        height: 44px;
        overflow: hidden;
        border: 1px solid #ccc;
        padding: 4px;
      }
      .card p {
        margin: 0;
        font-size: 12px;
        line-height: 14px;
      }
      .ok {
        font-size: 18px;
        line-height: 1.6;
        max-width: 60ch;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Clipping trap</h1>
      <p class="ok">
        This paragraph is already comfortable and should not need any change at
        all from the engine.
      </p>
      <div class="cards">
        <div class="card" id="card-1">
          <p>
            Small print that fits exactly in this fixed height box until the
            text grows or spreads.
          </p>
        </div>
        <div class="card" id="card-2">
          <p>
            Another small caption with enough words to wrap onto a second line
            inside the box.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
