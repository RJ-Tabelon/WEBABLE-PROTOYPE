<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hidden constraint</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, sans-serif;
      }
      main p {
        margin: 0 0 4px;
        font-size: 12px;
        line-height: 15px;
      }
      /*
       * The notes' clipping box is sized by a column four levels above the
       * text (its height is set below, to the notes at their own size).
       * Nothing within three ancestors of the text says it cannot grow, so
       * only the checks after a change can find out that it clips.
       */
      .outer {
        display: flex;
        flex-direction: column;
        width: 320px;
      }
      .pane {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <div class="outer">
        <div class="pane">
          <div>
            <div>
              <p id="note-1">
                Small print that fits this panel exactly until it grows, then
                the panel cuts it off.
              </p>
              <p>
                Another line of small print in the same panel, written to fill
                it.
              </p>
            </div>
          </div>
        </div>
      </div>
      <p id="free">
        A paragraph outside the panel, free to grow with the rest.
      </p>
    </main>
    <script>
      // As tall as the notes at their own size, whatever the font metrics.
      const outer = document.querySelector('.outer');
      outer.style.height = `${outer.querySelector('.pane').scrollHeight}px`;
    </script>
  </body>
</html>
