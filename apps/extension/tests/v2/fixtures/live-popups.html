<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live: popups</title>
    <script src="/__v2/live.js"></script>
    <style>
      body {
        font: 16px system-ui;
      }
      #menu {
        position: absolute;
        background: #fff;
        border: 1px solid #333;
      }
      #menu [role='menuitem'] {
        padding: 6px 12px;
      }
      #sugg {
        position: absolute;
        background: #fff;
        border: 1px solid #333;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #sugg li {
        padding: 4px 8px;
      }
      #toast {
        position: fixed;
        left: 16px;
        bottom: 16px;
        background: #222;
        color: #fff;
        padding: 8px 16px;
        display: none;
      }
      #toast span[role='button'] {
        color: #9cf;
        margin-left: 12px;
      }
      #cover {
        position: fixed;
        inset: 0;
        margin: 0;
        width: 100vw;
        height: 100vh;
        border: 0;
        background: rgb(0 0 0 / 0.6);
        color: #fff;
      }
      .spacer {
        height: 1600px;
      }
    </style>
  </head>
  <body>
    <script>
      window.log = [];
    </script>
    <main data-scope data-id="e1">
      <h1>Popups</h1>

      <div class="spacer"></div>
      <!-- A menu button whose menu is a persistent element toggled by style. -->
      <button
        type="button"
        id="more"
        data-id="e20"
        data-proxy="button"
        aria-haspopup="menu"
        aria-expanded="false"
      >
        More
      </button>
      <div role="menu" id="menu" style="display: none">
        <div role="menuitem" tabindex="-1">Mute</div>
        <div role="menuitem" tabindex="-1">Report</div>
      </div>

      <!-- A combobox with a suggestions listbox. -->
      <input
        data-id="e21"
        data-proxy="input"
        role="combobox"
        aria-label="Search fruit"
        aria-controls="sugg"
        aria-autocomplete="list"
        aria-expanded="false"
        id="fruit"
      />
      <ul role="listbox" id="sugg" hidden></ul>

      <!-- A confirmation dialog the site opens with showModal(). -->
      <button
        type="button"
        data-id="e22"
        data-proxy="button"
        onclick="confirmDlg.showModal()"
      >
        Delete draft
      </button>
      <dialog id="confirmDlg">
        <p>Delete this draft?</p>
        <button type="button" id="cancel" onclick="confirmDlg.close('cancel')">
          Cancel
        </button>
        <button
          type="button"
          id="ok"
          onclick="
            log.push('draft-deleted');
            confirmDlg.close('ok');
          "
        >
          Delete
        </button>
      </dialog>
      <dialog id="expiry">
        <p>Your session expires soon.</p>
        <button type="button" onclick="expiry.close()">Stay signed in</button>
      </dialog>

      <!-- Records with Archive, a toast with Undo. -->
      <ul data-list="e30" id="mail">
        <li data-key="m1">
          <span data-slot="title">Lunch on Friday</span>
          <button type="button" data-slot="archive" data-proxy="button">
            Archive
          </button>
        </li>
        <li data-key="m2">
          <span data-slot="title">Quarterly numbers</span>
          <button type="button" data-slot="archive" data-proxy="button">
            Archive
          </button>
        </li>
        <li data-key="m3">
          <span data-slot="title">Garden club</span>
          <button type="button" data-slot="archive" data-proxy="button">
            Archive
          </button>
        </li>
      </ul>
      <div id="toast">
        <span id="toastText">Conversation archived.</span
        ><span role="button" tabindex="0" id="undo">Undo</span>
      </div>

      <!-- Links and buttons that need the person's activation. -->
      <a
        data-id="e40"
        data-proxy="link"
        id="help"
        href="/v2/blank.html"
        target="_blank"
        >Open help</a
      >
      <button type="button" data-id="e41" data-proxy="button" id="print">
        Print preview
      </button>

      <!-- Irreversible, toggles, a select, a button that does nothing. -->
      <button
        type="button"
        data-id="e42"
        data-proxy="button"
        data-irreversible
        onclick="log.push('bought')"
      >
        Buy now
      </button>
      <button
        type="button"
        data-id="e43"
        data-proxy="toggle"
        aria-pressed="false"
        id="like"
      >
        Like
      </button>
      <label
        ><input
          type="checkbox"
          data-id="e44"
          data-proxy="toggle"
          id="remember"
        />
        Remember me</label
      >
      <select
        data-id="e45"
        data-proxy="select"
        id="sort"
        onchange="log.push('sort:' + this.value)"
      >
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
      </select>
      <button type="button" data-id="e46" data-proxy="button">
        Does nothing
      </button>
      <div class="spacer"></div>
    </main>
    <div id="cover" popover="manual">Big sale today</div>

    <script>
      const more = document.getElementById('more');
      const menu = document.getElementById('menu');
      more.addEventListener('click', () => {
        const open = menu.style.display === 'none';
        menu.style.display = open ? 'block' : 'none';
        more.setAttribute('aria-expanded', String(open));
        const r = more.getBoundingClientRect();
        menu.style.left = `${r.left + scrollX}px`;
        menu.style.top = `${r.bottom + scrollY}px`;
      });
      menu.addEventListener('click', (e) => {
        const item = e.target.closest('[role="menuitem"]');
        if (!item) return;
        log.push(`menu:${item.textContent}`);
        menu.style.display = 'none';
        more.setAttribute('aria-expanded', 'false');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menu.style.display !== 'none') {
          menu.style.display = 'none';
          more.setAttribute('aria-expanded', 'false');
          log.push('menu-escaped');
        }
      });

      const fruits = [
        'apple',
        'apricot',
        'avocado',
        'banana',
        'blueberry',
        'cherry',
      ];
      const fruit = document.getElementById('fruit');
      const sugg = document.getElementById('sugg');
      fruit.addEventListener('input', () => {
        const v = fruit.value.trim().toLowerCase();
        const hits = v ? fruits.filter((f) => f.startsWith(v)) : [];
        sugg.replaceChildren(
          ...hits.map((f) => {
            const li = document.createElement('li');
            li.setAttribute('role', 'option');
            li.id = `opt-${f}`;
            li.textContent = f;
            return li;
          }),
        );
        sugg.hidden = hits.length === 0;
        fruit.setAttribute('aria-expanded', String(!sugg.hidden));
      });
      sugg.addEventListener('mousedown', (e) => e.preventDefault());
      sugg.addEventListener('click', (e) => {
        const li = e.target.closest('[role="option"]');
        if (!li) return;
        fruit.value = li.textContent;
        sugg.hidden = true;
        log.push(`pick:${li.textContent}`);
      });
      fruit.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          sugg.hidden = true;
          log.push('sugg-escaped');
        }
      });

      const toast = document.getElementById('toast');
      let archived = null;
      let hideTimer = 0;
      document.getElementById('mail').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        const li = e.target.closest('li');
        if (!b || !li) return;
        log.push(`archive:${li.dataset.key}`);
        archived = {
          li,
          next: li.nextElementSibling,
          parent: li.parentElement,
        };
        li.remove();
        setTimeout(() => {
          toast.style.display = 'block';
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => (toast.style.display = 'none'), 10000);
        }, 200);
      });
      document.getElementById('undo').addEventListener('click', () => {
        log.push('undo');
        if (archived) archived.parent.insertBefore(archived.li, archived.next);
        archived = null;
        toast.style.display = 'none';
      });

      document.getElementById('help').addEventListener('click', (e) => {
        e.preventDefault();
        const w = window.open(e.currentTarget.href, '_blank');
        log.push(w ? 'help-opened' : 'help-blocked');
      });
      document.getElementById('print').addEventListener('click', () => {
        const w = window.open('/v2/blank.html');
        log.push(w ? 'print-opened' : 'print-blocked');
      });
      document.getElementById('like').addEventListener('click', (e) => {
        const b = e.currentTarget;
        setTimeout(
          () =>
            b.setAttribute(
              'aria-pressed',
              String(b.getAttribute('aria-pressed') !== 'true'),
            ),
          150,
        );
      });
      document
        .getElementById('remember')
        .addEventListener('change', (e) =>
          log.push(`remember:${e.target.checked}`),
        );
    </script>
  </body>
</html>
