<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live: media</title>
    <script src="/__v2/live.js"></script>
  </head>
  <body>
    <main data-scope data-id="e1">
      <h1>Podcast</h1>
      <audio id="early" loop muted></audio>
      <audio id="late" loop muted></audio>
      <button type="button" data-id="e2" data-proxy="button">Subscribe</button>
    </main>
    <script>
      // One second of a quiet tone as a WAV blob: no network, no files.
      function wav() {
        const rate = 8000;
        const n = rate;
        const buf = new ArrayBuffer(44 + n * 2);
        const v = new DataView(buf);
        const str = (o, s) =>
          [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
        str(0, 'RIFF');
        v.setUint32(4, 36 + n * 2, true);
        str(8, 'WAVE');
        str(12, 'fmt ');
        v.setUint32(16, 16, true);
        v.setUint16(20, 1, true);
        v.setUint16(22, 1, true);
        v.setUint32(24, rate, true);
        v.setUint32(28, rate * 2, true);
        v.setUint16(32, 2, true);
        v.setUint16(34, 16, true);
        str(36, 'data');
        v.setUint32(40, n * 2, true);
        for (let i = 0; i < n; i++)
          v.setInt16(44 + i * 2, Math.sin(i / 8) * 800, true);
        return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
      }
      const src = wav();
      for (const a of document.querySelectorAll('audio')) a.src = src;
      window.playEarly = () => document.getElementById('early').play();
      window.playLate = () => document.getElementById('late').play();
    </script>
  </body>
</html>
