<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inbox fixture</title>
    <!--
      A webmail inbox shaped like Gmail's: a top bar with mail search and
      account controls, a left rail (Compose and labels with counts), a
      toolbar with a select-all checkbox and pager, and a role=grid table of
      message rows. Unread rows are bold and carry a different class from
      read rows ("zA zE" vs "zA yO"), each row has a checkbox, a star, the
      sender, subject and snippet (ellipsised), sometimes a label badge or an
      attachment, a date, and hover-only actions (archive, delete, mark as
      read, snooze) that a :hover rule reveals. Thread ids sit on an inner
      span, as in Gmail; the row ids are volatile. window.fixture re-renders
      the rows and delivers new mail.
    -->
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #202124;
        background: #f6f8fc;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .gb {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 64px;
        padding: 0 16px;
        background: #f6f8fc;
        z-index: 5;
      }
      .icon {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        font-size: 18px;
      }
      .logo {
        width: 109px;
        font-size: 22px;
        color: #444;
        text-decoration: none;
      }
      .search {
        display: flex;
        align-items: center;
        flex: 0 1 720px;
        height: 48px;
        margin-left: 60px;
        background: #eaf1fb;
        border-radius: 24px;
      }
      .search input {
        flex: 1;
        height: 46px;
        border: 0;
        background: transparent;
        font-size: 16px;
      }
      .account {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #1a73e8;
        color: #fff;
        text-decoration: none;
      }
      .app {
        display: flex;
      }
      .side {
        width: 256px;
        flex: none;
        padding-right: 16px;
      }
      .compose {
        display: inline-flex;
        align-items: center;
        height: 56px;
        margin: 8px 0 16px 8px;
        padding: 0 24px;
        border: 0;
        border-radius: 16px;
        background: #c2e7ff;
        font-size: 14px;
        font-weight: 500;
      }
      .lbl {
        display: flex;
        justify-content: space-between;
        height: 32px;
        align-items: center;
        padding: 0 12px 0 26px;
        border-radius: 0 16px 16px 0;
        color: #202124;
        text-decoration: none;
      }
      .lbl[aria-current='page'] {
        background: #d3e3fd;
        font-weight: 700;
      }
      .count {
        font-size: 12px;
      }
      .main {
        flex: 1;
        min-width: 0;
        background: #fff;
        border-radius: 16px;
        margin-right: 16px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 48px;
        padding: 0 16px;
      }
      .cb {
        width: 18px;
        height: 18px;
        border: 2px solid #5f6368;
        border-radius: 2px;
        box-sizing: border-box;
      }
      .pager {
        margin-left: auto;
        display: inline-block;
        width: 120px;
        overflow: hidden;
        white-space: nowrap;
        font-size: 12px;
        color: #5f6368;
      }
      .pager .tail {
        display: inline-block;
        margin-left: 300px;
      }
      table.F {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      tr.zA {
        height: 40px;
        cursor: pointer;
        border-bottom: 1px solid #f1f3f4;
      }
      tr.zA.yO {
        background: #f2f6fc;
      }
      tr.zA td {
        padding: 0 8px;
        white-space: nowrap;
      }
      td.ck {
        width: 20px;
      }
      td.st {
        width: 20px;
      }
      td.sn {
        width: 168px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      td.sj {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      td.dt {
        width: 72px;
        text-align: right;
        font-size: 12px;
      }
      td.ac {
        width: 140px;
      }
      .zE .zF,
      .zE .bog,
      .zE .dt span {
        font-weight: 700;
      }
      .y2 {
        color: #5f6368;
      }
      .badge {
        display: inline-block;
        padding: 0 4px;
        margin-right: 6px;
        border-radius: 4px;
        background: #ddd;
        font-size: 12px;
      }
      .att {
        display: inline-block;
        width: 16px;
        height: 16px;
      }
      .star {
        display: inline-block;
        width: 20px;
        height: 20px;
        font-size: 16px;
        line-height: 20px;
        color: #c4c7c5;
      }
      ul.bqY {
        display: none;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 4px;
      }
      tr.zA:hover ul.bqY,
      tr.zA:focus-within ul.bqY {
        display: flex;
      }
      tr.zA:hover td.dt span {
        display: none;
      }
      li.bqX {
        width: 28px;
        height: 28px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <header class="gb" role="banner" data-qa="banner">
      <button class="icon" aria-label="Main menu" aria-expanded="true">
        ☰
      </button>
      <a class="logo" href="#inbox" aria-label="Mail">Mail</a>
      <form class="search" role="search" data-qa="search">
        <button class="icon" type="button" aria-label="Search mail">⌕</button>
        <input
          type="text"
          name="q"
          aria-label="Search mail"
          placeholder="Search mail"
          data-qa="search-input"
        />
        <button class="icon" type="button" aria-label="Show search options">
          ≡
        </button>
      </form>
      <div class="account">
        <button class="icon" aria-label="Support" aria-haspopup="menu">
          ?
        </button>
        <button class="icon" aria-label="Settings">⚙</button>
        <a
          class="avatar"
          href="/accounts"
          aria-label="Account: Pat Quillon (private@example.com)"
          data-qa="account"
          >P</a
        >
      </div>
    </header>
    <div class="app">
      <nav class="side" role="navigation" aria-label="Mailboxes" data-qa="side">
        <button class="compose" data-qa="compose">Compose</button>
        <div class="labels">
          <a class="lbl" href="#inbox" aria-current="page"
            ><span class="name">Inbox</span><span class="count">1,234</span></a
          >
          <a class="lbl" href="#starred"
            ><span class="name">Starred</span><span class="count"></span
          ></a>
          <a class="lbl" href="#snoozed"
            ><span class="name">Snoozed</span><span class="count"></span
          ></a>
          <a class="lbl" href="#sent"
            ><span class="name">Sent</span><span class="count"></span
          ></a>
          <a class="lbl" href="#drafts"
            ><span class="name">Drafts</span><span class="count">3</span></a
          >
          <a class="lbl" href="#spam"
            ><span class="name">Spam</span><span class="count">12</span></a
          >
          <a class="lbl" href="#trash"
            ><span class="name">Trash</span><span class="count"></span
          ></a>
          <a class="lbl" href="#label/work"
            ><span class="name">Work</span><span class="count">7</span></a
          >
        </div>
      </nav>
      <div class="main" role="main" data-qa="main">
        <div
          class="toolbar"
          role="toolbar"
          aria-label="Actions"
          data-qa="toolbar"
        >
          <div
            class="cb"
            role="checkbox"
            aria-checked="false"
            tabindex="0"
            aria-label="Select"
          ></div>
          <button class="icon" aria-label="Refresh">↻</button>
          <button
            class="icon"
            aria-label="More email options"
            aria-haspopup="menu"
          >
            ⋮
          </button>
          <span class="pager" data-qa="pager"
            ><span>1–50 of 2,345</span
            ><span class="tail">(next page ready)</span></span
          >
          <button class="icon" aria-label="Newer" disabled>‹</button>
          <button class="icon" aria-label="Older">›</button>
        </div>
        <table class="F" role="grid" aria-readonly="true" data-qa="grid">
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script>
      (function () {
        var senders = [
          ['Pat Quillon', 'quillon@example.com'],
          ['Vesperine Hale', 'vesperine@example.com'],
          ['Zebulon Marsh', 'zebulon@example.com'],
          ['Garden Club', 'club@example.org'],
          ['Library Desk', 'desk@example.org'],
        ];
        var subjects = [
          'Quarterly basket count',
          'Bench repairs on Saturday',
          'Your library hold is ready',
          'Minutes from the garden meeting',
          'Trail map draft for review',
          'Photos from the market',
          'Volunteer schedule for next month',
        ];
        var snippets = [
          'Here are the totals for every basket we recorded this quarter, broken down by week and by volunteer',
          'We will meet at the north gate at nine and bring the long ladder from the shed',
          'The book you asked for is waiting at the front desk until the end of next week',
          'Attached are the minutes, please add anything I missed before Friday',
        ];
        var dates = [
          '9:41 AM',
          '8:12 AM',
          'Oct 12',
          'Oct 11',
          'Oct 9',
          'Sep 30',
        ];
        window.fixtureMail = [];
        for (var i = 0; i < 20; i++) {
          window.fixtureMail.push({
            thread: '18c2f' + (40000 + i * 7).toString(16),
            sender: senders[i % senders.length],
            subject: subjects[i % subjects.length],
            snippet: snippets[i % snippets.length],
            date: dates[Math.min(dates.length - 1, Math.floor(i / 3))],
            unread: i % 3 === 0,
            badge: i % 4 === 1 ? 'Work' : null,
            attachment: i % 5 === 2,
          });
        }
        var seq = 0;
        function row(m) {
          var tr = document.createElement('tr');
          tr.className = 'zA ' + (m.unread ? 'zE' : 'yO');
          tr.setAttribute('role', 'row');
          tr.setAttribute('tabindex', '-1');
          tr.id = ':' + (seq++).toString(36);
          tr.setAttribute('data-qa', 'row-' + m.thread);
          tr.innerHTML =
            '<td class="ck"><div class="cb" role="checkbox" aria-checked="false" tabindex="-1" aria-label="Select conversation"></div></td>' +
            '<td class="st"><span class="star" role="button" aria-label="Not starred" tabindex="-1">☆</span></td>' +
            '<td class="sn"><span class="zF" email="' +
            m.sender[1] +
            '" name="' +
            m.sender[0] +
            '">' +
            (m.unread ? '<span class="sr-only">Unread, </span>' : '') +
            m.sender[0] +
            '</span></td>' +
            '<td class="sj" role="gridcell">' +
            (m.badge
              ? '<span class="badge" title="' +
                m.badge +
                '">' +
                m.badge +
                '</span>'
              : '') +
            '<span class="bog"><span data-thread-id="#thread-f:' +
            m.thread +
            '" data-legacy-thread-id="' +
            m.thread +
            '">' +
            m.subject +
            '</span></span><span class="y2"> - ' +
            m.snippet +
            '</span>' +
            (m.attachment
              ? '<img class="att" alt="Attachment" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27/%3E">'
              : '') +
            '</td>' +
            '<td class="dt"><span title="' +
            m.date +
            '">' +
            m.date +
            '</span></td>' +
            '<td class="ac"><ul class="bqY" role="toolbar" aria-label="Row actions">' +
            '<li class="bqX" role="button" aria-label="Archive" tabindex="-1">▣</li>' +
            '<li class="bqX" role="button" aria-label="Delete" tabindex="-1">✕</li>' +
            '<li class="bqX" role="button" aria-label="' +
            (m.unread ? 'Mark as read' : 'Mark as unread') +
            '" tabindex="-1">✉</li>' +
            '<li class="bqX" role="button" aria-label="Snooze" tabindex="-1">◷</li>' +
            '</ul></td>';
          return tr;
        }
        var tbody = document.getElementById('rows');
        function render() {
          tbody.textContent = '';
          window.fixtureMail.forEach(function (m) {
            tbody.appendChild(row(m));
          });
        }
        render();
        window.fixture = {
          /** Re-create every row node (new volatile ids), same order. */
          rerender: render,
          /** New mail arrives at the top; every row shifts down one. */
          receive: function () {
            var m = {
              thread: '18c30' + (seq + 1000).toString(16),
              sender: ['Marmalade Press', 'press@example.net'],
              subject: 'New issue out today',
              snippet:
                'The autumn issue is here with the long piece on the quarry road',
              date: '9:58 AM',
              unread: true,
              badge: null,
              attachment: false,
            };
            window.fixtureMail.unshift(m);
            tbody.insertBefore(row(m), tbody.firstChild);
          },
          /** Mark the first row read (class and weight change, same node). */
          markFirstRead: function () {
            var tr = tbody.firstElementChild;
            tr.className = 'zA yO';
          },
        };
      })();
    </script>
  </body>
</html>
