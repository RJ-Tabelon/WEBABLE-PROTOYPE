<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live: routes</title>
    <script src="/__v2/live.js"></script>
    <style>
      li {
        height: 48px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Gmail-style hash routes: #inbox is the list, #inbox/<id> a thread.
      const threads = Array.from({ length: 40 }, (_, i) => ({
        id: `t${i}`,
        subject: `Subject ${i}`,
      }));
      const app = document.getElementById('app');
      function render() {
        const h = location.hash || '#inbox';
        if (h.startsWith('#inbox/')) {
          const id = h.slice('#inbox/'.length);
          const t = threads.find((x) => x.id === id);
          app.innerHTML =
            `<article data-scope data-id="e50"><h1>${t ? t.subject : 'Missing'}</h1>` +
            '<p>Thread body for the conversation.</p>' +
            (id === 't5' ? '<video width="800" height="450"></video>' : '') +
            '<a data-id="e51" data-proxy="link" href="#inbox">Back to inbox</a></article>';
        } else {
          app.innerHTML =
            '<h1>Inbox</h1><ul data-list="e10" data-open="title">' +
            threads
              .map(
                (t) =>
                  `<li data-key="${t.id}"><span data-slot="title" data-proxy="button" role="link" tabindex="0">${t.subject}</span></li>`,
              )
              .join('') +
            '</ul>';
        }
      }
      // Rows have no href: one delegated handler opens the thread.
      document.addEventListener('click', (e) => {
        const li = e.target.closest('li[data-key]');
        if (li && e.target.closest('[data-slot="title"]'))
          location.hash = `#inbox/${li.dataset.key}`;
      });
      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
