<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live: records</title>
    <script src="/__v2/live.js"></script>
    <style>
      body {
        margin: 0;
        font: 16px system-ui;
      }
      #scroller {
        height: 400px;
        overflow: auto;
        position: relative;
        border: 1px solid #999;
      }
      #rows {
        position: relative;
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
        height: 40px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Feed</h1>
    <!-- A virtualized list: only rows near the scroll position exist. -->
    <div id="scroller">
      <div id="rows" data-list="e10" data-open="title"></div>
    </div>
    <script>
      const N = 300;
      const H = 40;
      const rows = document.getElementById('rows');
      const scroller = document.getElementById('scroller');
      rows.style.height = `${N * H}px`;
      window.log = [];
      // The full model, for the view (records seen by key across the session).
      window.__records = {
        e10: Array.from({ length: N + 1 }, (_, i) => ({
          key: i === N ? 'k999' : `k${i}`,
          slots: [
            {
              slot: 'title',
              role: 'text',
              label: i === N ? 'Gone row' : `Row ${i}`,
            },
            { slot: 'del', role: 'button', label: 'Delete' },
          ],
        })),
      };
      function draw() {
        const first = Math.max(0, Math.floor(scroller.scrollTop / H) - 3);
        const last = Math.min(
          N - 1,
          Math.ceil((scroller.scrollTop + scroller.clientHeight) / H) + 3,
        );
        const keep = new Set();
        for (let i = first; i <= last; i++) keep.add(`k${i}`);
        for (const el of Array.from(rows.children))
          if (!keep.has(el.dataset.key)) el.remove();
        for (let i = first; i <= last; i++) {
          if (rows.querySelector(`[data-key="k${i}"]`)) continue;
          const row = document.createElement('div');
          row.className = 'row';
          row.dataset.key = `k${i}`;
          row.style.top = `${i * H}px`;
          row.innerHTML = `<span data-slot="title">Row ${i}</span> <button type="button" data-slot="del" data-proxy="button">Delete</button>`;
          rows.append(row);
        }
      }
      scroller.addEventListener('scroll', () => requestAnimationFrame(draw));
      // One delegated handler for every row's button.
      rows.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        const row = e.target.closest('.row');
        if (b && row) window.log.push(`deleted:${row.dataset.key}`);
      });
      draw();
    </script>
  </body>
</html>
