<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Read: video results</title>
    <!--
      YouTube-shaped search results (eval B4, M4, M6, m4): a long guide rail
      outside main, then main with result rows of one template. The first
      row is a sponsored slot with its own inner layout; organic rows have a
      thumbnail link (a large image with the duration drawn over it), a
      titled heading link, a meta line with "•" separators, a channel link
      and a snippet. Rows differ a little (a "New" badge, a chapters line), as
      real results do.
    -->
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
        display: flex;
      }
      .guide {
        width: 220px;
        flex: none;
      }
      .guide a {
        display: block;
        padding: 6px 12px;
      }
      main {
        flex: 1;
        padding: 16px;
      }
      .result {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
      }
      .thumb {
        position: relative;
        display: block;
        width: 320px;
        height: 180px;
        flex: none;
      }
      .thumb img {
        width: 320px;
        height: 180px;
        display: block;
        background: #789;
      }
      .dur {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: #000;
        color: #fff;
        font-size: 12px;
        padding: 0 4px;
      }
      .meta h3 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .line span {
        margin-right: 4px;
        font-size: 12px;
      }
      .snip {
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <nav class="guide" aria-label="Guide" data-qa="guide"></nav>
    <main>
      <h2>Results</h2>
      <div class="results" data-qa="results">
        <div class="result" data-qa="ad">
          <a class="thumb" href="https://ads.example/landing">
            <img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
          </a>
          <div class="meta">
            <a class="ad-title" href="https://ads.example/landing"
              >Safety rails for every industry, installed this week</a
            >
            <div>
              <span class="label">Sponsored</span> <span>ads.example</span>
            </div>
            <a class="cta" href="https://ads.example/landing">Visit site</a>
          </div>
          <button type="button" aria-label="My Ad Center">⋮</button>
        </div>
      </div>
    </main>
    <script>
      // The guide rail: many links, read after main.
      var guide = document.querySelector('.guide');
      for (var g = 0; g < 120; g++) {
        var a = document.createElement('a');
        a.href = '/feed/' + g;
        a.textContent = 'Guide link ' + g;
        guide.appendChild(a);
      }
      var titles = [
        'Accessibility vs. Inclusive Design',
        'The only accessibility video you will ever need',
        'Learn accessibility: a full tutorial',
        'Public transport accessibility in Melbourne',
        'Designing for low vision',
        'Keyboard navigation explained',
        'Screen readers in five minutes',
        'Captions that people can read',
      ];
      var list = document.querySelector('.results');
      titles.forEach(function (t, i) {
        var id = 'v' + (i + 1);
        var row = document.createElement('div');
        row.className = 'result';
        row.setAttribute('data-qa', 'video-' + i);
        row.innerHTML =
          '<a class="thumb" href="/watch?v=' +
          id +
          '"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="><span class="dur">' +
          (4 + i) +
          ':39</span></a>' +
          '<div class="meta"><h3><a class="title" href="/watch?v=' +
          id +
          '">' +
          t +
          '</a></h3>' +
          '<div class="line"><span>' +
          (30 + i) +
          'K views</span><span class="dot">•</span><span>' +
          (i + 1) +
          ' years ago</span></div>' +
          '<a class="channel" href="/@channel' +
          i +
          '">Channel ' +
          i +
          '</a>' +
          '<div class="snip">A short description of the video, as the site writes it.</div>' +
          (i % 3 === 1 ? '<span class="badge">New</span>' : '') +
          (i % 4 === 2
            ? '<div class="chapters"><span>7 chapters</span></div>'
            : '') +
          '</div>' +
          '<button type="button" aria-label="Action menu">⋮</button>';
        list.appendChild(row);
      });
    </script>
  </body>
</html>
